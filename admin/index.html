<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deciDATA Admin</title>
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        load_config_file: false,
        backend: {
          name: 'github',
          repo: 'JimenaTheaux/decidata-portfolio',
          branch: 'main',
          base_url: 'https://decidata-portfolio.vercel.app',
          auth_endpoint: 'api/auth'
        },
        media_folder: 'images',
        public_folder: '/images',
        collections: [
          {
            name: 'proyectos',
            label: 'Proyectos',
            folder: 'src/_data/proyectos',
            create: true,
            format: 'json',
            slug: '{{slug}}',
            fields: [
              { label: 'Nombre del cliente', name: 'titulo', widget: 'string' },
              { label: 'Rubro / Etiqueta', name: 'tag', widget: 'string', hint: 'Ej: Gimnasio · Sistema de gestión · 2026' },
              { label: 'Logo del cliente', name: 'logo', widget: 'image', required: false },
              { label: 'Foto mockup del sistema', name: 'mockup', widget: 'image', required: false },
              { label: 'Descripción corta (card)', name: 'descripcion', widget: 'text' },
              { label: 'El dolor del cliente', name: 'problema', widget: 'text' },
              { label: 'Quote del cliente', name: 'quote', widget: 'string' },
              { label: 'Autor del quote', name: 'quoteAutor', widget: 'string' },
              { label: 'Solución implementada', name: 'solucion', widget: 'string' },
              { label: 'Funcionalidades', name: 'funcionalidades', widget: 'list', field: { label: 'Funcionalidad', name: 'item', widget: 'string' } },
              { label: 'Resultados', name: 'resultados', widget: 'list', field: { label: 'Resultado', name: 'item', widget: 'string' } },
              { label: 'Chips del card', name: 'chips', widget: 'list', field: { label: 'Chip', name: 'item', widget: 'string' } },
              { label: 'Reseña — texto', name: 'resena_texto', widget: 'text', required: false },
              { label: 'Reseña — nombre', name: 'resena_nombre', widget: 'string', required: false },
              { label: 'Reseña — rol', name: 'resena_rol', widget: 'string', required: false },
              { label: 'Destacado en home', name: 'destacado', widget: 'boolean', default: false },
              { label: 'Orden en home', name: 'orden', widget: 'number', default: 99, required: false }
            ]
          },
          {
            name: 'configuracion',
            label: 'Configuración del sitio',
            files: [
              {
                label: 'Textos generales',
                name: 'general',
                file: 'src/_data/general.json',
                format: 'json',
                fields: [
                  { label: 'Hero — línea 1', name: 'hero_linea1', widget: 'string' },
                  { label: 'Hero — línea 2 (acento)', name: 'hero_linea2', widget: 'string' },
                  { label: 'Hero — párrafo', name: 'hero_parrafo', widget: 'text' },
                  { label: 'WhatsApp (con código país, sin +)', name: 'whatsapp', widget: 'string' },
                  { label: 'WhatsApp para mostrar', name: 'whatsapp_display', widget: 'string' },
                  { label: 'Nombre', name: 'nombre', widget: 'string' },
                  { label: 'Rol', name: 'rol', widget: 'string' },
                  { label: 'Foto de perfil', name: 'foto_perfil', widget: 'image', required: false },
                  { label: 'Bio párrafo 1', name: 'bio1', widget: 'text' },
                  { label: 'Bio párrafo 2', name: 'bio2', widget: 'text' },
                  { label: 'Stat 1 número', name: 'stat1_num', widget: 'string' },
                  { label: 'Stat 1 etiqueta', name: 'stat1_label', widget: 'string' },
                  { label: 'Stat 2 número', name: 'stat2_num', widget: 'string' },
                  { label: 'Stat 2 etiqueta', name: 'stat2_label', widget: 'string' },
                  { label: 'Stat 3 número', name: 'stat3_num', widget: 'string' },
                  { label: 'Stat 3 etiqueta', name: 'stat3_label', widget: 'string' },
                  { label: 'Stat 4 número', name: 'stat4_num', widget: 'string' },
                  { label: 'Stat 4 etiqueta', name: 'stat4_label', widget: 'string' },
                  { label: 'Sobre mí — etiqueta de sección', name: 'acerca_label', widget: 'string' },
                  { label: 'Sobre mí — título línea 1', name: 'acerca_h2_p1', widget: 'string' },
                  { label: 'Sobre mí — título línea 2', name: 'acerca_h2_p2', widget: 'string' },
                  { label: 'Sobre mí — título línea 3 (cursiva)', name: 'acerca_h2_em', widget: 'string' },
                  { label: 'Propuesta 1 — negrita', name: 'prop1_negrita', widget: 'string', hint: 'Ej: No tenés sistema' },
                  { label: 'Propuesta 1 — texto', name: 'prop1_texto', widget: 'string', hint: 'Ej: lo creamos desde cero' },
                  { label: 'Propuesta 2 — negrita', name: 'prop2_negrita', widget: 'string' },
                  { label: 'Propuesta 2 — texto', name: 'prop2_texto', widget: 'string' },
                  { label: 'Propuesta 3 — negrita', name: 'prop3_negrita', widget: 'string' },
                  { label: 'Propuesta 3 — texto', name: 'prop3_texto', widget: 'string' },
                  { label: 'Propuesta 4 — negrita', name: 'prop4_negrita', widget: 'string' },
                  { label: 'Propuesta 4 — texto', name: 'prop4_texto', widget: 'string' },
                  { label: 'Card perfil — texto 1', name: 'card_bio1', widget: 'text' },
                  { label: 'Card perfil — texto 2', name: 'card_bio2', widget: 'text' },
                  { label: 'Card perfil — chips / tags', name: 'about_tags', widget: 'list', field: { label: 'Tag', name: 'item', widget: 'string' } },
                  { label: 'Hook hero — línea 1', name: 'cta_h2_p1', widget: 'string', hint: 'Ej: ¿Gestionás en papel' },
                  { label: 'Hook hero — palabra en cursiva', name: 'cta_h2_em', widget: 'string', hint: 'Ej: WhatsApp?' },
                  { label: 'Hero — propuesta (párrafo bajo el hook)', name: 'propuesta_texto', widget: 'text' },
                  { label: 'CTA final — título', name: 'cta_titulo', widget: 'string', hint: 'Ej: ¿Empezamos?' },
                  { label: 'CTA final — subtítulo', name: 'cta_sub', widget: 'text' },
                  { label: 'Footer — copyright', name: 'footer_copy', widget: 'string', hint: 'Ej: © 2026 deciDATA' }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
