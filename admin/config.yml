backend:
  name: github
  repo: JimenaTheaux/decidata-portfolio
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "proyectos"
    label: "Proyectos"
    folder: "src/_data/proyectos"
    create: true
    format: "json"
    slug: "{{titulo}}"
    fields:
      - { label: "Nombre del cliente", name: "titulo", widget: "string" }
      - { label: "Rubro / Tag", name: "tag", widget: "string", hint: "Ej: Deportes, Ventas, Fabricación" }
      - { label: "Categoría (filtro)", name: "categoria", widget: "select", options: ["gestión", "stock", "pedidos"], hint: "Categoría para filtros del sitio" }
      - { label: "Logo del cliente", name: "logo", widget: "image", required: false }
      - { label: "Foto mockup del sistema", name: "mockup", widget: "image", required: false }
      - { label: "Descripción corta (card)", name: "descripcion", widget: "text" }
      - { label: "El problema del cliente", name: "problema", widget: "text" }
      - { label: "Quote del cliente", name: "quote", widget: "string" }
      - { label: "Autor del quote", name: "quoteAutor", widget: "string" }
      - { label: "Solución implementada", name: "solucion", widget: "string" }
      - { label: "Funcionalidades", name: "funcionalidades", widget: "list" }
      - { label: "Resultados", name: "resultados", widget: "list" }
      - { label: "Chips del card", name: "chips", widget: "list" }
      - { label: "Reseña — texto", name: "resena_texto", widget: "text", required: false }
      - { label: "Reseña — nombre", name: "resena_nombre", widget: "string", required: false }
      - { label: "Reseña — rol", name: "resena_rol", widget: "string", required: false }
      - { label: "Reseña — iniciales (avatar)", name: "resena_avatar", widget: "string", required: false, hint: "Ej: MM, AZ, MC" }
      - { label: "Destacado en home", name: "destacado", widget: "boolean", default: false }
      - { label: "Orden en home", name: "orden", widget: "number", default: 99, required: false }

  - name: "configuracion"
    label: "Configuración del sitio"
    files:
      - label: "Textos generales"
        name: "general"
        file: "src/_data/general.json"
        format: "json"
        fields:
          # — Identidad
          - { label: "Nombre", name: "nombre", widget: "string" }
          - { label: "Rol", name: "rol", widget: "string" }
          - { label: "Foto de perfil", name: "foto_perfil", widget: "image", required: false }
          - { label: "WhatsApp (con código país, sin +)", name: "whatsapp", widget: "string" }
          - { label: "WhatsApp para mostrar", name: "whatsapp_display", widget: "string" }
          - { label: "URL de LinkedIn", name: "linkedin_url", widget: "string" }

          # — Hero
          - { label: "Hero — eyebrow (etiqueta superior)", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero — línea 1", name: "hero_linea1", widget: "string" }
          - { label: "Hero — línea 2 (acento)", name: "hero_linea2", widget: "string" }
          - { label: "Hero — párrafo", name: "hero_parrafo", widget: "text" }
          - { label: "Hero — prueba social (texto pequeño)", name: "hero_proof", widget: "string" }

          # — Stats
          - { label: "Stat 1 — número (solo cifra)", name: "stat1_num", widget: "string" }
          - { label: "Stat 1 — sufijo", name: "stat1_suffix", widget: "string", required: false, hint: "Ej: +" }
          - { label: "Stat 1 — etiqueta", name: "stat1_label", widget: "string" }
          - { label: "Stat 1 — subetiqueta", name: "stat1_sublabel", widget: "string", required: false }
          - { label: "Stat 2 — texto (sin animación)", name: "stat2_display", widget: "string", hint: "Ej: 10–20" }
          - { label: "Stat 2 — etiqueta", name: "stat2_label", widget: "string" }
          - { label: "Stat 2 — subetiqueta", name: "stat2_sublabel", widget: "string", required: false }
          - { label: "Stat 3 — número (solo cifra)", name: "stat3_num", widget: "string" }
          - { label: "Stat 3 — prefijo", name: "stat3_prefix", widget: "string", required: false, hint: "Ej: +" }
          - { label: "Stat 3 — etiqueta", name: "stat3_label", widget: "string" }
          - { label: "Stat 3 — subetiqueta", name: "stat3_sublabel", widget: "string", required: false }
          - { label: "Stat 4 — número (solo cifra)", name: "stat4_num", widget: "string" }
          - { label: "Stat 4 — sufijo", name: "stat4_suffix", widget: "string", required: false, hint: "Ej: %" }
          - { label: "Stat 4 — etiqueta", name: "stat4_label", widget: "string" }
          - { label: "Stat 4 — subetiqueta", name: "stat4_sublabel", widget: "string", required: false }

          # — Sobre mí
          - { label: "Sobre mí — label", name: "acerca_label", widget: "string" }
          - { label: "Sobre mí — título", name: "acerca_h2_p1", widget: "string" }
          - { label: "Sobre mí — título (énfasis)", name: "acerca_h2_em", widget: "string" }
          - { label: "Bio párrafo 1", name: "bio1", widget: "text" }
          - { label: "Bio párrafo 2", name: "bio2", widget: "text" }
          - { label: "Skill 1", name: "skill1", widget: "string" }
          - { label: "Skill 2", name: "skill2", widget: "string" }
          - { label: "Skill 3", name: "skill3", widget: "string" }
          - { label: "Skill 4", name: "skill4", widget: "string" }
          - { label: "Propuesta 1 — negrita", name: "prop1_negrita", widget: "string" }
          - { label: "Propuesta 1 — texto", name: "prop1_texto", widget: "string" }
          - { label: "Propuesta 2 — negrita", name: "prop2_negrita", widget: "string" }
          - { label: "Propuesta 2 — texto", name: "prop2_texto", widget: "string" }
          - { label: "Propuesta 3 — negrita", name: "prop3_negrita", widget: "string" }
          - { label: "Propuesta 3 — texto", name: "prop3_texto", widget: "string" }
          - { label: "Propuesta 4 — negrita", name: "prop4_negrita", widget: "string" }
          - { label: "Propuesta 4 — texto", name: "prop4_texto", widget: "string" }

          # — Cómo trabajo (Proceso)
          - { label: "Proceso — label", name: "proceso_label", widget: "string" }
          - { label: "Proceso — título", name: "proceso_h2", widget: "string" }
          - { label: "Paso 1 — ícono (emoji)", name: "paso1_icono", widget: "string" }
          - { label: "Paso 1 — título", name: "paso1_titulo", widget: "string" }
          - { label: "Paso 1 — descripción", name: "paso1_desc", widget: "text" }
          - { label: "Paso 2 — ícono (emoji)", name: "paso2_icono", widget: "string" }
          - { label: "Paso 2 — título", name: "paso2_titulo", widget: "string" }
          - { label: "Paso 2 — descripción", name: "paso2_desc", widget: "text" }
          - { label: "Paso 3 — ícono (emoji)", name: "paso3_icono", widget: "string" }
          - { label: "Paso 3 — título", name: "paso3_titulo", widget: "string" }
          - { label: "Paso 3 — descripción", name: "paso3_desc", widget: "text" }
          - { label: "Paso 4 — ícono (emoji)", name: "paso4_icono", widget: "string" }
          - { label: "Paso 4 — título", name: "paso4_titulo", widget: "string" }
          - { label: "Paso 4 — descripción", name: "paso4_desc", widget: "text" }

          # — Contacto
          - { label: "Contacto — badge", name: "contacto_badge", widget: "string" }
          - { label: "Contacto — título", name: "contacto_h2", widget: "string" }
          - { label: "Contacto — subtítulo", name: "contacto_sub", widget: "text" }
          - { label: "Contacto — tiempo respuesta", name: "contacto_respuesta", widget: "string" }
          - { label: "Contacto — ubicación", name: "contacto_ubicacion", widget: "string" }

          # — Footer
          - { label: "Footer — tagline", name: "footer_tagline", widget: "string" }
          - { label: "Footer — copyright", name: "footer_copy", widget: "string" }
          - { label: "Footer — texto derecho", name: "footer_right", widget: "string" }
