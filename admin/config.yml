backend:
  name: github
  repo: JimenaTheaux/decidata-portfolio
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "proyectos"
    label: "Proyectos"
    folder: "src/_data/proyectos"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Nombre del cliente", name: "titulo", widget: "string" }
      - { label: "Rubro / Etiqueta", name: "tag", widget: "string", hint: "Ej: Gimnasio · Sistema de gestión · 2026" }
      - { label: "Logo del cliente", name: "logo", widget: "image", required: false, hint: "PNG con fondo transparente preferido" }
      - { label: "Foto mockup del sistema", name: "mockup", widget: "image", required: false, hint: "Captura del sistema terminado. Si no hay foto, se muestra un placeholder." }
      - { label: "Descripción corta (se ve en la card)", name: "descripcion", widget: "text", hint: "1-2 líneas. Lo que se ve en la card del proyecto." }
      - { label: "El dolor del cliente", name: "problema", widget: "text", hint: "Cómo lo describirías vos. 3-4 líneas." }
      - { label: "Quote del cliente", name: "quote", widget: "string", hint: "Frase exacta. Sin comillas." }
      - { label: "Autor del quote", name: "quoteAutor", widget: "string", hint: "Ej: Mary Mendoza · Dueña, Tu Tiempo Gym" }
      - { label: "Solución implementada", name: "solucion", widget: "string", hint: "Ej: App web con dashboard integrado y roles diferenciados." }
      - { label: "Funcionalidades", name: "funcionalidades", widget: "list", hint: "Una por línea. Se muestran en el detalle del proyecto." }
      - { label: "Resultados", name: "resultados", widget: "list", hint: "3 resultados concretos. Sin números del negocio." }
      - { label: "Chips del card", name: "chips", widget: "list", hint: "3-4 palabras clave. Ej: Dashboard, Pagos, WhatsApp" }
      - { label: "Reseña — texto", name: "resena_texto", widget: "text", required: false }
      - { label: "Reseña — nombre", name: "resena_nombre", widget: "string", required: false }
      - { label: "Reseña — rol", name: "resena_rol", widget: "string", required: false, hint: "Ej: Tu Tiempo Gym · Dueña" }
      - { label: "Destacado en home (aparece entre los 3 principales)", name: "destacado", widget: "boolean", default: false }
      - { label: "Orden en home (1, 2, 3...)", name: "orden", widget: "number", default: 99, required: false }

  - name: "configuracion"
    label: "Configuración del sitio"
    files:
      - label: "Textos generales"
        name: "general"
        file: "src/_data/general.json"
        format: "json"
        fields:
          - { label: "Hero — línea 1", name: "hero_linea1", widget: "string" }
          - { label: "Hero — línea 2 (color acento)", name: "hero_linea2", widget: "string" }
          - { label: "Hero — párrafo descripción", name: "hero_parrafo", widget: "text" }
          - { label: "Número WhatsApp (con código de país, sin +)", name: "whatsapp", widget: "string", hint: "Ej: 5493525529966" }
          - { label: "WhatsApp para mostrar", name: "whatsapp_display", widget: "string", hint: "Ej: 3525-529966" }
          - { label: "Tu nombre", name: "nombre", widget: "string" }
          - { label: "Tu rol", name: "rol", widget: "string" }
          - { label: "Bio párrafo 1", name: "bio1", widget: "text" }
          - { label: "Bio párrafo 2", name: "bio2", widget: "text" }
          - { label: "Stat 1 — número", name: "stat1_num", widget: "string" }
          - { label: "Stat 1 — etiqueta", name: "stat1_label", widget: "string" }
          - { label: "Stat 2 — número", name: "stat2_num", widget: "string" }
          - { label: "Stat 2 — etiqueta", name: "stat2_label", widget: "string" }
          - { label: "Stat 3 — número", name: "stat3_num", widget: "string" }
          - { label: "Stat 3 — etiqueta", name: "stat3_label", widget: "string" }
          - { label: "Stat 4 — número", name: "stat4_num", widget: "string" }
          - { label: "Stat 4 — etiqueta", name: "stat4_label", widget: "string" }
