backend:
  name: github
  repo: JimenaTheaux/decidata-portfolio
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "proyectos"
    label: "Proyectos"
    folder: "src/_data/proyectos"
    create: true
    format: "json"
    slug: "{{titulo}}"
    fields:
      - { label: "Nombre del cliente", name: "titulo", widget: "string" }
      - { label: "Rubro / Tag", name: "tag", widget: "string", hint: "Ej: Deportes, Ventas, Fabricación" }
      - { label: "Categoría (filtro)", name: "categoria", widget: "select", options: ["gestión", "stock", "pedidos"], hint: "Categoría para filtros del sitio" }
      - { label: "Logo del cliente", name: "logo", widget: "image", required: false }
      - { label: "Foto mockup del sistema", name: "mockup", widget: "image", required: false }
      - { label: "Descripción corta (card)", name: "descripcion", widget: "text" }
      - { label: "El problema del cliente", name: "problema", widget: "text" }
      - { label: "Quote del cliente", name: "quote", widget: "string" }
      - { label: "Autor del quote", name: "quoteAutor", widget: "string" }
      - { label: "Solución implementada", name: "solucion", widget: "string" }
      - { label: "Funcionalidades", name: "funcionalidades", widget: "list" }
      - { label: "Resultados", name: "resultados", widget: "list" }
      - { label: "Chips del card", name: "chips", widget: "list" }
      - { label: "Reseña — texto", name: "resena_texto", widget: "text", required: false }
      - { label: "Reseña — nombre", name: "resena_nombre", widget: "string", required: false }
      - { label: "Reseña — rol", name: "resena_rol", widget: "string", required: false }
      - { label: "Reseña — iniciales (avatar)", name: "resena_avatar", widget: "string", required: false, hint: "Ej: MM, AZ, MC" }
      - { label: "Destacado en home", name: "destacado", widget: "boolean", default: false }
      - { label: "Orden en home", name: "orden", widget: "number", default: 99, required: false }

  - name: "configuracion"
    label: "Configuración del sitio"
    files:

      - label: "🌐 Identidad & Contacto"
        name: "identidad"
        file: "src/_data/general.json"
        format: "json"
        fields:
          - { label: "Nombre completo", name: "nombre", widget: "string" }
          - { label: "Rol / cargo", name: "rol", widget: "string" }
          - { label: "Foto de perfil", name: "foto_perfil", widget: "image", required: false }
          - { label: "WhatsApp (con código país, sin +)", name: "whatsapp", widget: "string", hint: "Ej: 5493525529966" }
          - { label: "WhatsApp para mostrar", name: "whatsapp_display", widget: "string", hint: "Ej: 3525-529966" }
          - { label: "URL de LinkedIn", name: "linkedin_url", widget: "string" }
          # campos requeridos para preservar el JSON completo al guardar
          - { label: "_hero_eyebrow", name: "hero_eyebrow", widget: "hidden" }
          - { label: "_hero_linea1", name: "hero_linea1", widget: "hidden" }
          - { label: "_hero_linea2", name: "hero_linea2", widget: "hidden" }
          - { label: "_hero_parrafo", name: "hero_parrafo", widget: "hidden" }
